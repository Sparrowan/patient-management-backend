spring.application.name=auth-service
server.port=4002

# The value Spring stamps into the JWT `iss` claim, and that resource servers will validate against.
auth.jwt.issuer=auth-service
# Access-token lifetime.
auth.jwt.ttl=PT1H

# --- Datasource (MariaDB) --- secrets from .env (spring-dotenv, no prefix), fallback after ':'.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/auth_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate --- Flyway owns the schema; Hibernate only validates (never auto-creates).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway (migrations) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator health for probes.
management.endpoints.web.exposure.include=health,info,prometheus
# Tag every metric with the service name so Prometheus/Grafana can tell services apart.
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true

# Quieter security logging by default; bump to DEBUG when learning the filter chain.
logging.level.org.springframework.security=INFO
