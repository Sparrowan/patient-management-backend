spring.application.name=auth-service
server.port=4002

# The value Spring stamps into the JWT `iss` claim, and that resource servers will validate against.
auth.jwt.issuer=auth-service
# Private JWK (JSON) used to sign tokens. UNSET generates an ephemeral key per start-up, which is
# fine locally and broken in production twice over: every restart invalidates all live tokens, and
# two replicas sign with different keys so verification fails across them. Set this to a mounted
# secret (file:/run/secrets/jwt-signing-key.json) in any shared environment. A set-but-missing path
# fails start-up rather than falling back — a silent fallback is what hid this problem originally.
auth.jwt.key-location=${JWT_KEY_LOCATION:}
# Access-token lifetime.
auth.jwt.ttl=PT1H

# --- Default-admin seeding: OFF unless explicitly switched on ---
# Creates admin/password with ROLE_ADMIN on an empty database, which is exactly the role that gates
# every money movement. It used to run unconditionally, so a fresh production database came up with
# guessable total control of the money path. Fail-closed by default: local dev opts in via .env
# (SEED_DEFAULT_ADMIN=true), and nothing else should. See DataSeeder for why this is a property
# rather than @Profile("!prod") — a negated profile is fail-OPEN if the profile is unset or typo'd.
auth.seed-default-admin=${SEED_DEFAULT_ADMIN:false}

# --- Datasource (MariaDB) --- secrets from .env (spring-dotenv, no prefix), fallback after ':'.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/auth_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate --- Flyway owns the schema; Hibernate only validates (never auto-creates).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Flyway (migrations) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Actuator health for probes.
management.endpoints.web.exposure.include=health,info,prometheus
# Tag every metric with the service name so Prometheus/Grafana can tell services apart.
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.probes.enabled=true

# --- Distributed tracing (Micrometer Tracing → OpenTelemetry → OTLP → Jaeger) ---
# Sample everything in dev; prod injects a lower rate. The OTLP endpoint is externalized because it
# is an environment-varying address. Login/register spans continue any traceparent from the gateway.
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

# Quieter security logging by default; bump to DEBUG when learning the filter chain.
logging.level.org.springframework.security=INFO

# --- Connection pool (HikariCP) ---
# Declared, not inherited. The Spring default of 10 is a reasonable number but an undeclared one:
# nothing records it, nothing reviews it, and the instance ceiling it implies is invisible.
#
# THE CEILING THIS SETS. A pool is per JVM, so the fleet-wide limit is
#     replicas x pools_per_replica x maximum-pool-size  <  max_connections - headroom
# This service runs one pool, so at 8 per instance against MariaDB's max_connections=151 (less ~10
# for ops) the ceiling is ~17 instances per database. Worth knowing before it is reached, because
# Exhaustion does not announce itself as "too many connections": callers block in
# getConnection() and surface as acquisition timeouts, which read like a slow database.
#
# AND WHY NOT BIGGER. Counter-intuitively, a bigger pool is usually worse. The database executes
# only so much concurrently; a deep pool does not add capacity, it just moves the queue from the
# pool (where connection-timeout bounds it and the metric is visible) into the database (where it
# shows up as lock contention and context switching). Small pools are the tuned answer, which is
# why this goes DOWN from the default rather than up. open-in-view=false already returns connections
# at the end of the service method rather than the end of the request, which is the bigger lever.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
# Fail a borrow attempt in 3s rather than letting a request hang on an exhausted pool. Bounding this
# is what turns pool exhaustion into a fast, attributable error instead of a pile-up.
spring.datasource.hikari.connection-timeout=3000
# Recycle connections well inside MariaDB's wait_timeout so the pool never hands out a socket the
# server has already closed.
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=${spring.application.name}
