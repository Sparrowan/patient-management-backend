# Container/production profile.
# Native structured logging (Spring Boot 3.4+): one JSON object per line in Elastic Common
# Schema, ready for Loki/ELK/CloudWatch. MDC is included automatically — the request correlation
# id (requestId) and, once a span is active, the tracing ids.
logging.structured.format.console=ecs
# Log ↔ trace correlation: Micrometer puts traceId/spanId in the MDC; rename them to the ECS-standard
# trace.id / span.id fields so Elastic/Kibana (and Jaeger cross-links) recognize them as the trace
# correlation keys rather than arbitrary MDC entries. A log line then pivots straight to its trace.
logging.structured.json.rename.traceId=trace.id
logging.structured.json.rename.spanId=span.id
