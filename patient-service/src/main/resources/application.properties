spring.application.name=patient-service
server.port=4000

# Finish in-flight requests before dying (zero-downtime deploys / k8s).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Show the per-request correlation id (set by CorrelationIdFilter) on each console line.
logging.pattern.level=%5p [%X{requestId:-}]

# Defaults to dev locally; prod overrides via SPRING_PROFILES_ACTIVE.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Datasource (MariaDB) ---
# Secrets come from .env (loaded by spring-dotenv). spring-dotenv 4 exposes .env keys
# WITHOUT a prefix, so it's ${DB_URL}, not ${env.DB_URL}. The value after ':' is a fallback
# used only when the key is missing.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/patient_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- Read replica (read/write splitting) ---
# Read-only transactions are routed here (see DataSourceConfig); writes and Flyway always use the
# primary above. Defaults to the primary's own URL, so a single-database setup behaves exactly as
# before and routing is a harmless no-op — point REPLICA_DB_URL at a real replica to split traffic.
app.datasource.replica.url=${REPLICA_DB_URL:${spring.datasource.url}}
app.datasource.replica.username=${REPLICA_DB_USERNAME:${spring.datasource.username}}
app.datasource.replica.password=${REPLICA_DB_PASSWORD:${spring.datasource.password}}

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only validates against it (never auto-creates).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Security (resource server) ---
# Where to fetch auth-service's public keys (JWKS) to verify JWT signatures. Fetched once, cached.
# Docker overrides the host to the auth-service container.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:4002/oauth2/jwks}

# --- Actuator (observability) ---
# health is public for load-balancer/k8s probes; details only when authorized.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Tag every metric with the service name so Prometheus/Grafana can tell services apart.
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# --- Distributed tracing (Micrometer Tracing → OpenTelemetry → OTLP → Jaeger) ---
# Sample everything in dev so every request is inspectable; prod injects a lower rate. The OTLP
# endpoint is an environment-varying address (localhost here; the jaeger container in compose;
# a collector in prod), so it's externalized. HTTP, the outbound gRPC call, and the Kafka producer
# all propagate the W3C traceparent automatically once the tracing deps are present.
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

# --- Logging ---
logging.level.root=INFO
logging.level.com.pm=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# --- Pagination ---
# Cap page size: without max-page-size a client could request ?size=1000000 and pull the
# whole table in one request.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# --- Redis (cache-aside store for GET /{id}) --- reuses the Redis the gateway runs. Lettuce connects
# lazily, so the app boots fine even if Redis is down (the cache fails open — see CacheConfig).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
# Cache provider is Redis (tests set this to 'none' to swap in a no-op manager — see CacheConfig).
spring.cache.type=redis

# --- Kafka (producer only: outbox relay → patient-events, Avro) --- Docker overrides the hosts.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
# The producer KafkaTemplate is configured explicitly in KafkaProducerConfig.
# The relay's scheduled tick can be switched off (tests drive it directly); on by default.
outbox.relay.enabled=${OUTBOX_RELAY_ENABLED:true}
# How often the outbox relay polls for unpublished rows.
outbox.relay.poll-interval-ms=1000

# --- gRPC client (billing) — synchronous deletion veto (CloseAccountForPatient), over mTLS.
#     'localhost' (local) and 'billing-service' (docker) are both SANs on billing's cert. ---
grpc.client.billing.address=${BILLING_GRPC_ADDRESS:static://localhost:9001}
grpc.client.billing.negotiation-type=TLS
grpc.client.billing.security.trust-cert-collection=classpath:certs/ca-cert.pem
# MUST be true or our client cert is configured but never presented (billing then rejects us with
# TLSV1_ALERT_CERTIFICATE_REQUIRED).
grpc.client.billing.security.client-auth-enabled=true
grpc.client.billing.security.certificate-chain=classpath:certs/patient-cert.pem
grpc.client.billing.security.private-key=classpath:certs/patient-key.pem

# --- Circuit breaker on the billing veto ---
# Behavioral config, so it stays here rather than becoming env vars: these numbers encode a
# correctness argument, and a stray override would either stall deletes or open the breaker on
# healthy traffic.
#
# Why a breaker at all: the 3s deadline bounds ONE call. Measured against a billing brownout
# (container paused — TCP connects, nothing answers), six consecutive deletes each paid the full
# ~3.0-3.2s. Every one of those holds a Tomcat worker and an open transaction, so a billing
# brownout becomes patient-service thread exhaustion. A hard-down billing needs no breaker at all
# (refused connection fails in ~10-20ms); this is for the brownout.
resilience4j.circuitbreaker.instances.billingVeto.sliding-window-type=COUNT_BASED
# 10 calls, decide after 5. Deletes are low-volume and admin-only, so a time-based window could sit
# half-empty for minutes; counting gives a decision on real traffic instead of on the clock.
resilience4j.circuitbreaker.instances.billingVeto.sliding-window-size=10
resilience4j.circuitbreaker.instances.billingVeto.minimum-number-of-calls=5
# Deliberately high. The veto is a correctness gate, not a nice-to-have: opening it means refusing
# every delete, so it should only open when billing is genuinely broken, not when one call lost a
# race. At 3s per failure, 50% of 5 calls is still only ~7.5s of stalling before it trips.
resilience4j.circuitbreaker.instances.billingVeto.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.billingVeto.wait-duration-in-open-state=20s
resilience4j.circuitbreaker.instances.billingVeto.permitted-number-of-calls-in-half-open-state=2
resilience4j.circuitbreaker.instances.billingVeto.automatic-transition-from-open-to-half-open-enabled=true
# A slow call is the brownout's signature, and the reason a deadline alone is not enough: without
# this, calls that always take 2.9s and succeed would never trip the breaker while still exhausting
# the thread pool. 1s is well above the measured healthy warm path (~25-30ms) and well below the 3s
# deadline, so it catches degradation before every request is timing out.
resilience4j.circuitbreaker.instances.billingVeto.slow-call-rate-threshold=50
resilience4j.circuitbreaker.instances.billingVeto.slow-call-duration-threshold=1s
# A funded account is billing answering CORRECTLY. Counting those as failures would open the
# breaker on legitimate business rejections and start handing out 503s for what is really a 409.
resilience4j.circuitbreaker.instances.billingVeto.ignore-exceptions[0]=com.pm.patientservice.exception.PatientDeletionConflictException
# Breaker state + call metrics on /actuator/prometheus (resilience4j-micrometer is on the
# classpath), and the state transitions on the health endpoint — an open breaker should be visible
# without reading logs.
resilience4j.circuitbreaker.instances.billingVeto.register-health-indicator=true

# --- Flyway (migrations) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Scheduling ---
# Spring's default scheduler pool is ONE thread, so every @Scheduled job in a service serialises
# behind the slowest one. Here that means a retention sweep can delay the outbox relay, which is a
# latency-sensitive 1s poller. One thread per scheduled job plus headroom, so they never queue.
spring.task.scheduling.pool.size=${SCHEDULING_POOL_SIZE:4}

# --- Connection pool (HikariCP) ---
# Declared, not inherited. The Spring default of 10 is a reasonable number but an undeclared one:
# nothing records it, nothing reviews it, and the instance ceiling it implies is invisible.
#
# THE CEILING THIS SETS. A pool is per JVM, so the fleet-wide limit is
#     replicas x pools_per_replica x maximum-pool-size  <  max_connections - headroom
# patient-service runs TWO pools per instance (primary + read replica), so at 8 each an instance
# holds 16 connections, and against MariaDB's max_connections=151 (less ~10 for ops and
# replication) that is ~8 instances per database -- not the ~14 a single-pool estimate suggests.
# Exhaustion does not announce itself as "too many connections": callers block in
# getConnection() and surface as acquisition timeouts, which read like a slow database.
#
# AND WHY NOT BIGGER. Counter-intuitively, a bigger pool is usually worse. The database executes
# only so much concurrently; a deep pool does not add capacity, it just moves the queue from the
# pool (where connection-timeout bounds it and the metric is visible) into the database (where it
# shows up as lock contention and context switching). Small pools are the tuned answer, which is
# why this goes DOWN from the default rather than up. open-in-view=false already returns connections
# at the end of the service method rather than the end of the request, which is the bigger lever.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
# Fail a borrow attempt in 3s rather than letting a request hang on an exhausted pool. Bounding this
# is what turns pool exhaustion into a fast, attributable error instead of a pile-up.
spring.datasource.hikari.connection-timeout=3000
# Recycle connections well inside MariaDB's wait_timeout so the pool never hands out a socket the
# server has already closed.
spring.datasource.hikari.max-lifetime=600000
#
# NOTE for this service specifically: read/write splitting replaced Boot's auto-configured
# DataSource with hand-built beans in DataSourceConfig, and `spring.datasource.hikari.*` only binds
# to the auto-configured one. So these values are read EXPLICITLY there via @Value -- they are the
# source of truth, but the wiring is manual. Add a setting here and it does nothing until
# DataSourceConfig reads it. The replica's pool is sized separately under app.datasource.replica.pool.
