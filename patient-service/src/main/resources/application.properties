spring.application.name=patient-service
server.port=4000

# Finish in-flight requests before dying (zero-downtime deploys / k8s).
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# Show the per-request correlation id (set by CorrelationIdFilter) on each console line.
logging.pattern.level=%5p [%X{requestId:-}]

# Defaults to dev locally; prod overrides via SPRING_PROFILES_ACTIVE.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Datasource (MariaDB) ---
# Secrets come from .env (loaded by spring-dotenv). spring-dotenv 4 exposes .env keys
# WITHOUT a prefix, so it's ${DB_URL}, not ${env.DB_URL}. The value after ':' is a fallback
# used only when the key is missing.
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/patient_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate ---
# Flyway owns the schema; Hibernate only validates against it (never auto-creates).
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Actuator (observability) ---
# health is public for load-balancer/k8s probes; details only when authorized.
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# --- Logging ---
logging.level.root=INFO
logging.level.com.pm=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN

# --- Pagination ---
# Cap page size: without max-page-size a client could request ?size=1000000 and pull the
# whole table in one request.
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# --- Kafka (event producer) ---
# The outbox relay publishes PatientRegistered here as Avro; the schema is registered in Schema
# Registry. Docker overrides the hosts to the compose service names.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=io.confluent.kafka.serializers.KafkaAvroSerializer
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
# Multiple event types share the patient-events topic, so each Avro type needs its OWN registry
# subject (topic-recordName) instead of the default single "<topic>-value" — which would reject the
# second, incompatible schema.
spring.kafka.producer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.TopicRecordNameStrategy
# acks=all: the broker only acks once the record is fully replicated — no silent loss on failover.
spring.kafka.producer.acks=all

# How often the outbox relay polls for unpublished rows.
outbox.relay.poll-interval-ms=1000

# --- Flyway (migrations) ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
