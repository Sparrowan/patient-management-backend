# Root orchestration for the patient-management system. Each service is built from its own
# Dockerfile and gets its own database container (database-per-service). Bring the stack up with:
#   ./generate-certs.sh          # dev mTLS certs for billing's gRPC server (once)
#   docker compose up --build
#
# Event backbone: Kafka (KRaft, no ZooKeeper) + Confluent Schema Registry (Avro contracts).
# kafka-ui (http://localhost:8080) is a dev-only console to watch topics/messages/schemas/DLQ.
#
# Dev credentials are inline here on purpose (local only). Production injects secrets via the
# environment / a secrets manager — never committed.

services:
  # --- Event infrastructure -------------------------------------------------------------------
  kafka:
    image: confluentinc/cp-kafka:7.8.0
    container_name: kafka
    environment:
      # KRaft single-node: this one broker is also the controller (no ZooKeeper).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: "1@kafka:9093"
      # INTERNAL (kafka:9092) is for in-network clients; EXTERNAL (localhost:9092) is host-mapped
      # so a service running on the host (local dev) can reach the same broker.
      KAFKA_LISTENERS: "INTERNAL://kafka:9092,CONTROLLER://kafka:9093,EXTERNAL://0.0.0.0:29092"
      KAFKA_ADVERTISED_LISTENERS: "INTERNAL://kafka:9092,EXTERNAL://localhost:9092"
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: "CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT"
      KAFKA_INTER_BROKER_LISTENER_NAME: "INTERNAL"
      KAFKA_CONTROLLER_LISTENER_NAMES: "CONTROLLER"
      # Single broker → everything replicates to itself.
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      # Fixed cluster id keeps the KRaft metadata log stable across restarts.
      CLUSTER_ID: "MkU3OEVBNTcwNTJENDM2Qk"
    ports:
      - "9092:29092"   # host localhost:9092 → container EXTERNAL listener (local dev)
    healthcheck:
      # Probe the INTERNAL listener by its own hostname — it's bound to the `kafka` interface,
      # not localhost (EXTERNAL is on :29092), so localhost:9092 would wrongly report unhealthy.
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "kafka:9092"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    networks:
      - patient-net

  schema-registry:
    image: confluentinc/cp-schema-registry:7.8.0
    container_name: schema-registry
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
    ports:
      - "8081:8081"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - patient-net

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:latest
    container_name: kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
      DYNAMIC_CONFIG_ENABLED: "true"
    ports:
      - "8080:8080"
    networks:
      - patient-net

  # --- patient-service (event producer via the transactional outbox) --------------------------
  patient-service-db:
    image: mariadb:11.7
    container_name: patient-service-db
    environment:
      MARIADB_DATABASE: patient_db
      MARIADB_USER: patient
      MARIADB_PASSWORD: patient
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - patient-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - patient-net

  patient-service:
    build:
      context: ./patient-service
    image: patient-management/patient-service:latest
    container_name: patient-service
    depends_on:
      patient-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      billing-service:
        condition: service_started
      auth-service:
        condition: service_started
    environment:
      # Points at the DB container over the compose network (service name is the hostname).
      DB_URL: jdbc:mariadb://patient-service-db:3306/patient_db
      DB_USERNAME: patient
      DB_PASSWORD: patient
      # Non-dev profile: base config, no SQL logging.
      SPRING_PROFILES_ACTIVE: docker
      # Event backbone (in-network hostnames).
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # Reach billing's gRPC server (deletion veto) over the compose network.
      BILLING_GRPC_ADDRESS: static://billing-service:9001
      # Fetch auth-service's public keys (JWKS) to verify JWTs in-network.
      AUTH_JWKS_URI: http://auth-service:4002/oauth2/jwks
    ports:
      - "4000:4000"
    networks:
      - patient-net

  # --- billing-service (event consumer; also keeps a synchronous gRPC API) --------------------
  billing-service-db:
    image: mariadb:11.7
    container_name: billing-service-db
    environment:
      MARIADB_DATABASE: billing_db
      MARIADB_USER: billing
      MARIADB_PASSWORD: billing
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - billing-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - patient-net

  billing-service:
    build:
      context: ./billing-service
    image: patient-management/billing-service:latest
    container_name: billing-service
    depends_on:
      billing-service-db:
        condition: service_healthy
      kafka:
        condition: service_healthy
      schema-registry:
        condition: service_healthy
      auth-service:
        condition: service_started
    environment:
      DB_URL: jdbc:mariadb://billing-service-db:3306/billing_db
      DB_USERNAME: billing
      DB_PASSWORD: billing
      SPRING_PROFILES_ACTIVE: docker
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      # Verify JWTs on REST calls against auth-service's JWKS (in-network).
      AUTH_JWKS_URI: http://auth-service:4002/oauth2/jwks
    ports:
      - "4001:4001"
      - "9001:9001"   # gRPC (synchronous API; published for host debugging)
    networks:
      - patient-net

  # --- auth-service (issues JWTs; resource servers verify against its JWKS) --------------------
  auth-service-db:
    image: mariadb:11.7
    container_name: auth-service-db
    environment:
      MARIADB_DATABASE: auth_db
      MARIADB_USER: auth
      MARIADB_PASSWORD: auth
      MARIADB_ROOT_PASSWORD: root
    volumes:
      - auth-db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - patient-net

  auth-service:
    build:
      context: ./auth-service
    image: patient-management/auth-service:latest
    container_name: auth-service
    depends_on:
      auth-service-db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mariadb://auth-service-db:3306/auth_db
      DB_USERNAME: auth
      DB_PASSWORD: auth
    ports:
      - "4002:4002"
    networks:
      - patient-net

  # --- redis (edge rate-limiter token-bucket store for the gateway) ---------------------------
  redis:
    image: redis:7-alpine
    container_name: redis
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - patient-net

  # --- api-gateway (single entry point; routes to every service) ------------------------------
  api-gateway:
    build:
      context: ./api-gateway
    image: patient-management/api-gateway:latest
    container_name: api-gateway
    depends_on:
      auth-service:
        condition: service_started
      patient-service:
        condition: service_started
      billing-service:
        condition: service_started
      redis:
        condition: service_healthy
    environment:
      # Downstream services by their in-network hostnames.
      AUTH_SERVICE_URI: http://auth-service:4002
      PATIENT_SERVICE_URI: http://patient-service:4000
      BILLING_SERVICE_URI: http://billing-service:4001
      # Edge JWT validation: fetch auth's JWKS over the compose network.
      AUTH_JWKS_URI: http://auth-service:4002/oauth2/jwks
      # Rate limiter's Redis + the browser origin(s) allowed through CORS.
      REDIS_HOST: redis
      GATEWAY_CORS_ALLOWED_ORIGINS: http://localhost:3000
    ports:
      - "4004:4004"
    networks:
      - patient-net

  # --- prometheus (scrapes every service's /actuator/prometheus) ------------------------------
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: prometheus
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "9090:9090"
    networks:
      - patient-net

volumes:
  patient-db-data:
  billing-db-data:
  auth-db-data:

networks:
  patient-net:
    driver: bridge
