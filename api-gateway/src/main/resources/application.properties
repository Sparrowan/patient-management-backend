spring.application.name=api-gateway
server.port=4004

# Downstream service addresses. Local defaults; docker-compose overrides to the container hostnames.
gateway.uris.auth=${AUTH_SERVICE_URI:http://localhost:4002}
gateway.uris.patient=${PATIENT_SERVICE_URI:http://localhost:4000}
gateway.uris.billing=${BILLING_SERVICE_URI:http://localhost:4001}

# Actuator health for probes; the gateway route list is handy while learning.
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.probes.enabled=true
