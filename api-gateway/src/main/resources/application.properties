spring.application.name=api-gateway
server.port=4004

# Downstream service addresses. Local defaults; docker-compose overrides to the container hostnames.
gateway.uris.auth=${AUTH_SERVICE_URI:http://localhost:4002}
gateway.uris.patient=${PATIENT_SERVICE_URI:http://localhost:4000}
gateway.uris.billing=${BILLING_SERVICE_URI:http://localhost:4001}

# Edge JWT validation — validate bearer tokens against auth-service's JWKS (the same public keys
# the resource servers use). Local, cached, stateless: no per-request call to auth.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:4002/oauth2/jwks}

# Redis — backing store for the edge rate limiter's token-bucket counters (shared across replicas).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# Edge rate limit (token bucket): sustained requests/sec and burst ceiling, per key (user sub or IP).
gateway.ratelimit.replenish-rate=${GATEWAY_RATELIMIT_REPLENISH:10}
gateway.ratelimit.burst-capacity=${GATEWAY_RATELIMIT_BURST:20}

# CORS — browser origins allowed to call the gateway (comma-separated; a real front-end origin per env).
gateway.cors.allowed-origins=${GATEWAY_CORS_ALLOWED_ORIGINS:http://localhost:3000}

# Actuator health for probes; the gateway route list is handy while learning.
management.endpoints.web.exposure.include=health,info,gateway
management.endpoint.health.probes.enabled=true
