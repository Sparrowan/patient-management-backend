# Container/production profile. Native structured JSON logging (Boot 3.4+, ECS format) so the
# gateway's logs aggregate and correlate like the other services' — plain console stays the
# local-dev default. Micrometer puts traceId/spanId in the MDC (reactive context propagation is
# on, see spring.reactor.context-propagation); rename them to the ECS-standard trace.id / span.id
# so a gateway log line pivots straight to its Jaeger trace.
logging.structured.format.console=ecs
logging.structured.json.rename.traceId=trace.id
logging.structured.json.rename.spanId=span.id
