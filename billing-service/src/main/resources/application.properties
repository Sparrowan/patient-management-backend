spring.application.name=billing-service
server.port=4001

# Defaults to dev locally; prod overrides via SPRING_PROFILES_ACTIVE.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Datasource (MariaDB) --- secrets from .env (spring-dotenv, no prefix).
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/billing_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate --- Flyway owns the schema; Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Security (resource server) --- verify JWTs against auth-service's JWKS. Docker overrides the host.
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${AUTH_JWKS_URI:http://localhost:4002/oauth2/jwks}

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics,prometheus
# Tag every metric with the service name so Prometheus/Grafana can tell services apart.
management.metrics.tags.application=${spring.application.name}
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# --- Distributed tracing (Micrometer Tracing → OpenTelemetry → OTLP → Jaeger) ---
# Sample everything in dev; prod injects a lower rate. The OTLP endpoint is an environment-varying
# address (localhost here; the jaeger container in compose; a collector in prod), so it's
# externalized. HTTP and the inbound gRPC server continue the traceparent automatically; the Kafka
# consumer needs the listener observation flag below to extract it from the record headers.
management.tracing.sampling.probability=${TRACING_SAMPLE_PROBABILITY:1.0}
management.otlp.tracing.endpoint=${OTLP_TRACING_ENDPOINT:http://localhost:4318/v1/traces}

# --- Logging ---
logging.level.root=INFO
logging.level.com.pm=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
# Show the per-request correlation id (set by CorrelationIdFilter) on each console line.
logging.pattern.level=%5p [%X{requestId:-}]

# --- Pagination caps ---
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# --- Payout saga worker --- how often the coordinator polls for due PENDING payouts to settle.
payout.saga.poll-interval-ms=2000

# --- Graceful shutdown ---
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- Kafka (event consumer) ---
# billing consumes the patient-events stream (Avro) and reacts. Docker overrides the hosts.
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.group-id=billing-service
# First boot with no committed offset starts at the beginning so no event is missed.
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
# ErrorHandlingDeserializer wraps the Avro deserializer: a poison/incompatible record surfaces a
# DeserializationException the error handler dead-letters, instead of jamming the partition.
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=io.confluent.kafka.serializers.KafkaAvroDeserializer
spring.kafka.properties.schema.registry.url=${SCHEMA_REGISTRY_URL:http://localhost:8081}
# Deserialize into the generated SpecificRecord (PatientRegistered / PatientDeleted), not generic.
spring.kafka.properties.specific.avro.reader=true
# Match the producer: multiple event types share the patient-events topic, each under its own subject.
spring.kafka.consumer.properties.value.subject.name.strategy=io.confluent.kafka.serializers.subject.TopicRecordNameStrategy
# Create a consumer span per record and extract the W3C traceparent from its headers, so the trace
# started at publish continues into the account-open (needs the tracing deps on the classpath).
spring.kafka.listener.observation-enabled=true

# --- gRPC server (net.devh) — synchronous API (OpenAccount). Kept for future synchronous callers;
#     registration now flows through Kafka, not this. ---
grpc.server.port=9001

# --- mTLS (mutual TLS): every gRPC call is encrypted AND both sides prove identity with certs.
#     This is the zero-trust baseline (never trust the network). DEV self-signed certs live in
#     src/main/resources/certs; in prod a service mesh (Istio) or Vault issues + rotates these.
grpc.server.security.enabled=true
# Our own identity: the cert we present to callers + its private key.
grpc.server.security.certificate-chain=classpath:certs/billing-cert.pem
grpc.server.security.private-key=classpath:certs/billing-key.pem
# The "mutual" part: REQUIRE a client certificate and verify it was signed by our CA.
# (Without this it's ordinary TLS — encrypted but the server doesn't authenticate the caller.)
grpc.server.security.client-auth=REQUIRE
grpc.server.security.trust-cert-collection=classpath:certs/ca-cert.pem

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Scheduling ---
# Spring's default scheduler pool is ONE thread, so every @Scheduled job in a service serialises
# behind the slowest one. Here that is a money problem, not just a tidiness one: a ledger archive
# sweep can move 20 x 500 = 10,000 rows, and while it holds the only thread the payout saga worker
# (2s poll, settles real money) simply does not run. One thread per scheduled job plus headroom.
spring.task.scheduling.pool.size=${SCHEDULING_POOL_SIZE:4}

# --- Connection pool (HikariCP) ---
# Declared, not inherited. The Spring default of 10 is a reasonable number but an undeclared one:
# nothing records it, nothing reviews it, and the instance ceiling it implies is invisible.
#
# THE CEILING THIS SETS. A pool is per JVM, so the fleet-wide limit is
#     replicas x pools_per_replica x maximum-pool-size  <  max_connections - headroom
# This service runs one pool, so at 8 per instance against MariaDB's max_connections=151 (less ~10
# for ops) the ceiling is ~17 instances per database. Worth knowing before it is reached, because
# Exhaustion does not announce itself as "too many connections": callers block in
# getConnection() and surface as acquisition timeouts, which read like a slow database.
#
# AND WHY NOT BIGGER. Counter-intuitively, a bigger pool is usually worse. The database executes
# only so much concurrently; a deep pool does not add capacity, it just moves the queue from the
# pool (where connection-timeout bounds it and the metric is visible) into the database (where it
# shows up as lock contention and context switching). Small pools are the tuned answer, which is
# why this goes DOWN from the default rather than up. open-in-view=false already returns connections
# at the end of the service method rather than the end of the request, which is the bigger lever.
spring.datasource.hikari.maximum-pool-size=${DB_POOL_MAX:8}
spring.datasource.hikari.minimum-idle=${DB_POOL_MIN_IDLE:2}
# Fail a borrow attempt in 3s rather than letting a request hang on an exhausted pool. Bounding this
# is what turns pool exhaustion into a fast, attributable error instead of a pile-up.
spring.datasource.hikari.connection-timeout=3000
# Recycle connections well inside MariaDB's wait_timeout so the pool never hands out a socket the
# server has already closed.
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.pool-name=${spring.application.name}
