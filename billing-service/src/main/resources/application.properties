spring.application.name=billing-service
server.port=4001

# Defaults to dev locally; prod overrides via SPRING_PROFILES_ACTIVE.
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# --- Datasource (MariaDB) --- secrets from .env (spring-dotenv, no prefix).
spring.datasource.url=${DB_URL:jdbc:mariadb://localhost:3306/billing_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}

# --- JPA / Hibernate --- Flyway owns the schema; Hibernate only validates.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# --- Actuator ---
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

# --- Logging ---
logging.level.root=INFO
logging.level.com.pm=INFO
logging.level.org.springframework.web=WARN
logging.level.org.hibernate=WARN
# Show the per-request correlation id (set by CorrelationIdFilter) on each console line.
logging.pattern.level=%5p [%X{requestId:-}]

# --- Pagination caps ---
spring.data.web.pageable.default-page-size=20
spring.data.web.pageable.max-page-size=100

# --- Graceful shutdown ---
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# --- gRPC server (net.devh) — patient-service calls OpenAccount here ---
grpc.server.port=9001

# --- mTLS (mutual TLS): every gRPC call is encrypted AND both sides prove identity with certs.
#     This is the zero-trust baseline (never trust the network). DEV self-signed certs live in
#     src/main/resources/certs; in prod a service mesh (Istio) or Vault issues + rotates these.
grpc.server.security.enabled=true
# Our own identity: the cert we present to callers + its private key.
grpc.server.security.certificate-chain=classpath:certs/billing-cert.pem
grpc.server.security.private-key=classpath:certs/billing-key.pem
# The "mutual" part: REQUIRE a client certificate and verify it was signed by our CA.
# (Without this it's ordinary TLS — encrypted but the server doesn't authenticate the caller.)
grpc.server.security.client-auth=REQUIRE
grpc.server.security.trust-cert-collection=classpath:certs/ca-cert.pem

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true
